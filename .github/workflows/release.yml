name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.0.8
        required: true
        default: v0.0.8
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      BETTERPAK_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run tests and static checks
        run: gradle --no-daemon --max-workers=1 :archive-core:test test lintRelease

      - name: Restore release keystore
        env:
          BETTERPAK_ANDROID_KEYSTORE_BASE64: ${{ secrets.BETTERPAK_ANDROID_KEYSTORE_BASE64 }}
          BETTERPAK_ANDROID_STORE_PASSWORD: ${{ secrets.BETTERPAK_ANDROID_STORE_PASSWORD }}
          BETTERPAK_ANDROID_KEY_ALIAS: ${{ secrets.BETTERPAK_ANDROID_KEY_ALIAS }}
          BETTERPAK_ANDROID_KEY_PASSWORD: ${{ secrets.BETTERPAK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BETTERPAK_ANDROID_KEYSTORE_BASE64"
          test -n "$BETTERPAK_ANDROID_STORE_PASSWORD"
          test -n "$BETTERPAK_ANDROID_KEY_ALIAS"
          test -n "$BETTERPAK_ANDROID_KEY_PASSWORD"
          signing_dir="$RUNNER_TEMP/betterpak-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$BETTERPAK_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/betterpak-release.p12"
          chmod 600 "$signing_dir/betterpak-release.p12"
          keytool -list \
            -storetype PKCS12 \
            -keystore "$signing_dir/betterpak-release.p12" \
            -storepass "$BETTERPAK_ANDROID_STORE_PASSWORD" \
            -alias "$BETTERPAK_ANDROID_KEY_ALIAS" > /dev/null
          {
            echo "BETTERPAK_KEYSTORE_PATH=$signing_dir/betterpak-release.p12"
            echo "BETTERPAK_KEYSTORE_PASSWORD=$BETTERPAK_ANDROID_STORE_PASSWORD"
            echo "BETTERPAK_KEY_ALIAS=$BETTERPAK_ANDROID_KEY_ALIAS"
            echo "BETTERPAK_KEY_PASSWORD=$BETTERPAK_ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APKs
        run: gradle --no-daemon --max-workers=1 assembleRelease

      - name: Verify release signatures
        run: |
          set -euo pipefail
          apk_dir="$GITHUB_WORKSPACE/app/build/outputs/apk/release"
          expected_abis=(arm64-v8a armeabi-v7a x86 universal)
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          fingerprints=()
          for abi in "${expected_abis[@]}"; do
            apk="$apk_dir/app-${abi}-release.apk"
            test -s "$apk"
            certificate_file="$RUNNER_TEMP/betterpak-${abi}-certificates.txt"
            "$apksigner" verify --verbose --print-certs "$apk" > "$certificate_file"
            fingerprint="$(sed -n 's/.*certificate SHA-256 digest: //p' "$certificate_file" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test -n "$fingerprint"
            fingerprints+=("$fingerprint")
          done
          test "${fingerprints[0]}" = "${fingerprints[1]}"
          test "${fingerprints[0]}" = "${fingerprints[2]}"
          test "${fingerprints[0]}" = "${fingerprints[3]}"
          test ! -d "$GITHUB_WORKSPACE/app/build/outputs/bundle"
          actual_fingerprint="${fingerprints[0]}"
          echo "BETTERPAK_CERTIFICATE_SHA256=$actual_fingerprint" >> "$GITHUB_ENV"

      - name: Archive release metadata and checksums
        run: |
          set -euo pipefail
          archive_dir="$GITHUB_WORKSPACE/app/build/outputs/release-archive"
          mkdir -p "$archive_dir"
          cp app/build/outputs/apk/release/app-*-release.apk "$archive_dir/"
          mapping_file="app/build/outputs/mapping/release/mapping.txt"
          test -s "$mapping_file"
          cp "$mapping_file" "$archive_dir/mapping.txt"
          (
            cd "$archive_dir"
            sha256sum app-*-release.apk > SHA256SUMS.txt
          )
          cat > "$archive_dir/RELEASE_METADATA.md" <<EOF
          # BetterPak Release Metadata

          - Version: ${BETTERPAK_RELEASE_TAG}
          - Commit: ${GITHUB_SHA}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Test and lint command: gradle --no-daemon --max-workers=1 :archive-core:test test lintRelease
          - Android build command: gradle --no-daemon --max-workers=1 assembleRelease
          - Signing certificate SHA-256: ${BETTERPAK_CERTIFICATE_SHA256}

          ## Artifacts

          | File | Bytes |
          | --- | ---: |
          EOF
          for apk in "$archive_dir"/app-*-release.apk; do
            printf '| %s | %s |\n' "$(basename "$apk")" "$(stat -c '%s' "$apk")" >> "$archive_dir/RELEASE_METADATA.md"
          done
          cat >> "$archive_dir/RELEASE_METADATA.md" <<EOF

          SHA-256 values are in SHA256SUMS.txt.

          The release archive includes mapping.txt for crash de-obfuscation.

          ## Known limitations

          ZIP, RAR/RAR5, 7z, TAR, Zstandard and tar.zst are included. ZIP/TAR/Zstandard password encryption and RAR creation remain unavailable. AAB is intentionally not produced by this workflow.

          ## Rollback

          Remove the GitHub Release and revert distribution to the previous verified tag after checking the archived checksums and certificate fingerprint.
          EOF

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betterpak-release-${{ github.sha }}
          path: |
            app/build/outputs/release-archive/app-*-release.apk
            app/build/outputs/release-archive/SHA256SUMS.txt
            app/build/outputs/release-archive/mapping.txt
            app/build/outputs/release-archive/RELEASE_METADATA.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Signing certificate SHA-256: `${{ env.BETTERPAK_CERTIFICATE_SHA256 }}`
          files: |
            app/build/outputs/release-archive/app-*-release.apk
            app/build/outputs/release-archive/SHA256SUMS.txt
            app/build/outputs/release-archive/mapping.txt
            app/build/outputs/release-archive/RELEASE_METADATA.md
