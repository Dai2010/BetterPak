name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.0.11
        required: true
        default: v0.0.11
      change_summary:
        description: "具体变更：独立 Zstandard 核心迁移、安全边界、Android 接入和验证状态"
        required: true
        default: "v0.0.11：新增独立 ZstandardArchiveCore；迁移 .zst 列表、解压、预览和外部打开；统一读取上限、取消、损坏归类和事务输出；保留 Android SAF 适配。"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      BETTERPAK_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      BETTERPAK_CHANGE_SUMMARY: ${{ github.event.inputs.change_summary || 'v0.0.11：新增独立 ZstandardArchiveCore；迁移 .zst 列表、解压、预览和外部打开；统一读取上限、取消、损坏归类和事务输出；保留 Android SAF 适配。' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate release request
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          test "${BETTERPAK_RELEASE_TAG#v}" = "$version_name"
          test -n "$BETTERPAK_CHANGE_SUMMARY"
          echo "Release tag: $BETTERPAK_RELEASE_TAG"
          echo "Change summary: $BETTERPAK_CHANGE_SUMMARY"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run tests and static checks
        run: gradle --no-daemon --max-workers=1 :archive-core:test test lintRelease

      - name: Restore release keystore
        env:
          BETTERPAK_ANDROID_KEYSTORE_BASE64: ${{ secrets.BETTERPAK_ANDROID_KEYSTORE_BASE64 }}
          BETTERPAK_ANDROID_STORE_PASSWORD: ${{ secrets.BETTERPAK_ANDROID_STORE_PASSWORD }}
          BETTERPAK_ANDROID_KEY_ALIAS: ${{ secrets.BETTERPAK_ANDROID_KEY_ALIAS }}
          BETTERPAK_ANDROID_KEY_PASSWORD: ${{ secrets.BETTERPAK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BETTERPAK_ANDROID_KEYSTORE_BASE64"
          test -n "$BETTERPAK_ANDROID_STORE_PASSWORD"
          test -n "$BETTERPAK_ANDROID_KEY_ALIAS"
          test -n "$BETTERPAK_ANDROID_KEY_PASSWORD"
          signing_dir="$RUNNER_TEMP/betterpak-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$BETTERPAK_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/betterpak-release.p12"
          chmod 600 "$signing_dir/betterpak-release.p12"
          keytool -list \
            -storetype PKCS12 \
            -keystore "$signing_dir/betterpak-release.p12" \
            -storepass "$BETTERPAK_ANDROID_STORE_PASSWORD" \
            -alias "$BETTERPAK_ANDROID_KEY_ALIAS" > /dev/null
          {
            echo "BETTERPAK_KEYSTORE_PATH=$signing_dir/betterpak-release.p12"
            echo "BETTERPAK_KEYSTORE_PASSWORD=$BETTERPAK_ANDROID_STORE_PASSWORD"
            echo "BETTERPAK_KEY_ALIAS=$BETTERPAK_ANDROID_KEY_ALIAS"
            echo "BETTERPAK_KEY_PASSWORD=$BETTERPAK_ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APKs
        run: gradle --no-daemon --max-workers=1 assembleRelease

      - name: Verify release signatures
        run: |
          set -euo pipefail
          apk_dir="$GITHUB_WORKSPACE/app/build/outputs/apk/release"
          expected_abis=(arm64-v8a armeabi-v7a x86 universal)
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          fingerprints=()
          for abi in "${expected_abis[@]}"; do
            apk="$apk_dir/app-${abi}-release.apk"
            test -s "$apk"
            certificate_file="$RUNNER_TEMP/betterpak-${abi}-certificates.txt"
            "$apksigner" verify --verbose --print-certs "$apk" > "$certificate_file"
            fingerprint="$(sed -n 's/.*certificate SHA-256 digest: //p' "$certificate_file" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test -n "$fingerprint"
            fingerprints+=("$fingerprint")
          done
          test "${fingerprints[0]}" = "${fingerprints[1]}"
          test "${fingerprints[0]}" = "${fingerprints[2]}"
          test "${fingerprints[0]}" = "${fingerprints[3]}"
          test ! -d "$GITHUB_WORKSPACE/app/build/outputs/bundle"
          actual_fingerprint="${fingerprints[0]}"
          echo "BETTERPAK_CERTIFICATE_SHA256=$actual_fingerprint" >> "$GITHUB_ENV"

      - name: Archive release metadata and checksums
        run: |
          set -euo pipefail
          archive_dir="$GITHUB_WORKSPACE/app/build/outputs/release-archive"
          mkdir -p "$archive_dir"
          cp app/build/outputs/apk/release/app-*-release.apk "$archive_dir/"
          mapping_file="app/build/outputs/mapping/release/mapping.txt"
          test -s "$mapping_file"
          cp "$mapping_file" "$archive_dir/mapping.txt"
          (
            cd "$archive_dir"
            sha256sum app-*-release.apk > SHA256SUMS.txt
          )
          cat > "$archive_dir/RELEASE_METADATA.md" <<EOF
          # BetterPak Release Metadata

          - Version: ${BETTERPAK_RELEASE_TAG}
          - Commit: ${GITHUB_SHA}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Test and lint command: gradle --no-daemon --max-workers=1 :archive-core:test test lintRelease
          - Android build command: gradle --no-daemon --max-workers=1 assembleRelease
          - Signing certificate SHA-256: ${BETTERPAK_CERTIFICATE_SHA256}

          ## Change summary

          ${BETTERPAK_CHANGE_SUMMARY}

          ## v0.0.11 change points

          - Adds the Kotlin/JVM ZstandardArchiveCore for independent .zst expanded-size measurement, bounded read, streaming copy and transactional extraction.
          - Centralizes expanded-size/read limits, cancellation, corrupt-stream classification, output conflict checks, symbolic-link parent rejection and temporary-file cleanup at the core boundary.
          - Routes Android independent .zst listing, extraction, preview, internal extraction and external opening through ZstandardArchiveCore while keeping SAF URI staging and DocumentFile output handling in Android.
          - Keeps the v0.0.9-fix2 DocumentsContract.isTreeUri() split: fromTreeUri() only for directory trees and fromSingleUri() for single files.
          - Does not add MANAGE_EXTERNAL_STORAGE, desktop support, RAR creation or archive password encryption.

          ## Artifacts

          | File | Bytes |
          | --- | ---: |
          EOF
          for apk in "$archive_dir"/app-*-release.apk; do
            printf '| %s | %s |\n' "$(basename "$apk")" "$(stat -c '%s' "$apk")" >> "$archive_dir/RELEASE_METADATA.md"
          done
          cat >> "$archive_dir/RELEASE_METADATA.md" <<EOF

          SHA-256 values are in SHA256SUMS.txt.

          The release archive includes mapping.txt for crash de-obfuscation.

          ## Known limitations

          ZIP, RAR/RAR5, 7z, TAR, Zstandard and tar.zst are included. ZIP/TAR/Zstandard password encryption and RAR creation remain unavailable. AAB is intentionally not produced by this workflow.

          ## Rollback

          Remove the GitHub Release and revert distribution to the previous verified tag after checking the archived checksums and certificate fingerprint.
          EOF

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betterpak-release-${{ github.sha }}
          path: |
            app/build/outputs/release-archive/app-*-release.apk
            app/build/outputs/release-archive/SHA256SUMS.txt
            app/build/outputs/release-archive/mapping.txt
            app/build/outputs/release-archive/RELEASE_METADATA.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## v0.0.11 变更点

            - 新增独立 Kotlin/JVM `ZstandardArchiveCore`，统一处理 `.zst` 的展开测量、受限读取、流式复制和事务式文件解压。
            - 核心层统一执行展开体积、读取上限、取消、损坏流归类、源/目标冲突、符号链接父路径和临时文件清理。
            - Android 独立 `.zst` 列表、解压、预览、内部存储解压和外部打开改为调用核心；SAF URI 暂存、`DocumentFile` 目标写入、chooser、进度转发和失败清理仍由 Android 适配层负责。
            - 保留 `v0.0.9-fix2` 的 SAF 修复：`/tree/...` 使用 `fromTreeUri()`，`/document/...` 单文件使用 `fromSingleUri()` 与 `ContentResolver.openInputStream()`，不新增 `MANAGE_EXTERNAL_STORAGE`。
            - 新增单流读取/复制/事务解压、展开上限、读取上限、损坏分类、取消清理、源归档覆盖和符号链接父路径测试；Release workflow 负责 Android 测试、Lint、签名构建、四 ABI 校验和 SHA-256 产物检查。

            ## 验证与限制

            - 发布门禁命令：`gradle --no-daemon --max-workers=1 :archive-core:test test lintRelease`。
            - 构建命令：`gradle --no-daemon --max-workers=1 assembleRelease`。
            - RAR/RAR5 和 7z 尚未迁入 `archive-core`；RAR 创建、ZIP/TAR/Zstandard 密码加密、桌面 GUI/TUI/CLI 和桌面平台支持仍不在本版本范围内。

            ## Submitted change summary

            ${{ github.event.inputs.change_summary || 'v0.0.11：新增独立 ZstandardArchiveCore；迁移 .zst 列表、解压、预览和外部打开；统一读取上限、取消、损坏归类和事务输出；保留 Android SAF 适配。' }}

            Signing certificate SHA-256: `${{ env.BETTERPAK_CERTIFICATE_SHA256 }}`
          files: |
            app/build/outputs/release-archive/app-*-release.apk
            app/build/outputs/release-archive/SHA256SUMS.txt
            app/build/outputs/release-archive/mapping.txt
            app/build/outputs/release-archive/RELEASE_METADATA.md
