name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is required for Release builds" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/betterpak-release.jks"
          chmod 600 "$RUNNER_TEMP/betterpak-release.jks"
          echo "BETTERPAK_KEYSTORE_PATH=$RUNNER_TEMP/betterpak-release.jks" >> "$GITHUB_ENV"

      - name: Build release artifacts
        env:
          BETTERPAK_KEYSTORE_PASSWORD: ${{ secrets.BETTERPAK_KEYSTORE_PASSWORD }}
          BETTERPAK_KEY_ALIAS: ${{ secrets.BETTERPAK_KEY_ALIAS }}
          BETTERPAK_KEY_PASSWORD: ${{ secrets.BETTERPAK_KEY_PASSWORD }}
        run: gradle --no-daemon lintRelease assembleRelease bundleRelease

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Calculate checksums
        run: sha256sum app/build/outputs/apk/release/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betterpak-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
